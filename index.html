<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 機器人｜課堂互動示範</title>
<style>
  :root{ --navy:#16324F; --muted:#7C8FA3; --primary:#1E5A8A;
         --primary-l:#E7F0F7; --line:#C9D6E2; }
  *{box-sizing:border-box}
  body{ margin:0; padding:36px 24px 60px; background:#fff; color:var(--navy);
        line-height:1.7;
        font-family:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",sans-serif; }
  .wrap{max-width:760px; margin:0 auto}
  .kicker{color:var(--muted); font-size:14px; letter-spacing:.5px}
  h1{font-size:28px; margin:4px 0 6px}
  .sub{color:var(--muted); font-size:15px; margin-bottom:28px;
       padding-bottom:20px; border-bottom:3px solid #C55A11}
  .card{ display:block; border:1px solid var(--line); border-radius:12px;
         padding:18px 20px; margin-bottom:14px; text-decoration:none;
         color:inherit; transition:.14s; }
  .card:hover{border-color:var(--primary); background:var(--primary-l)}
  .card h2{font-size:17px; margin:0 0 6px; color:var(--primary)}
  .card p{margin:0; font-size:14px; color:#41627F}
  .week{ display:inline-block; font-size:12px; font-weight:700; color:#fff;
         background:var(--primary); border-radius:10px; padding:1px 9px; margin-right:8px; }
  footer{margin-top:34px; font-size:13px; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">國立高雄科技大學　不分系</div>
  <h1>AI 機器人　課堂互動示範</h1>
  <div class="sub">115 學年度第 1 學期　｜　陳泓勳　｜　手機與電腦都可以開，不用安裝任何東西</div>

  <a class="card" href="conv-filter.html">
    <h2><span class="week">第 7 週</span>卷積濾波器互動實驗室</h2>
    <p>自己填 3×3 的權重，看同一張圖被卷積之後變成什麼樣子。
       可以點畫面上任一個像素，看那一格的乘加過程一步一步算出來。
       也可以上傳自己的照片試試看。</p>
  </a>

  <footer>這個頁面放的是上課用的互動示範；筆記本、投影片與作業請到數位學習平台。</footer>
</div>
</body>
</html>
